<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    padding:40px;
    width:350px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.login-box input{
    width:90%;
    padding:10px;
    margin:10px 0;
}

.login-box button{
    padding:10px 20px;
    background:#2e6ecb;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.login-box button:hover{
    background:#1c4fa3;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<form method="POST">
{% csrf_token %}

<input type="text" name="username" placeholder="Username"><br>
<input type="password" name="password" placeholder="Password"><br>

<button type="submit">Login</button>

</form>

<p>Don't have an account? <a href="/complaints/signup/">Signup</a></p>

</div>

</body>
</html>
