{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Complaint Management System</title>

<style>

bodybody{
    background-image: url("{% static 'static/images/support.jpg' %}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}
{
    margin:0;
    font-family: Arial;
}

.navbar{
    background:#1e6bd6;
    padding:15px;
    position:relative;
}

.nav-center{
    text-align:center;
}

.nav-center a{
    color:white;
    text-decoration:none;
    margin:0 20px;
    font-size:18px;
}

.nav-right{
    position:absolute;
    right:20px;
    top:15px;
}

.nav-right a{
    color:white;
    text-decoration:none;
    margin-left:15px;
}

.nav-center a:hover,
.nav-right a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="navbar">

<div class="nav-center">

<a href="/">Home</a>
<br>
<br>
<br>
<a href="/complaints/submit/">Submit Complaint</a>
<br>
<br>
<br>
<a href="/complaints/list/">My Complaints</a>
<br>
<br>
<br>
</div>

{% comment %} <div class="nav-left "> {% endcomment %}
<div class="nav-center">
{% if user.is_authenticated %}
<a href="/complaints/logout/">Logout</a>
{% else %}
<a href="/complaints/login/">Login</a>
<br>
<br>
<a href="/complaints/signup/">Signup</a>
{% endif %}
</div>

</div>

<div style="padding:30px;">
{% block content %}
{% endblock %}
</div>

</body>
</html>
